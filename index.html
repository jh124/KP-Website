<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5ef">
    <title>Kidderminster Press</title>
    <meta name="description" content="Christian classics, carefully prepared. Books from Kidderminster Press.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kidderminster Press">
    <meta property="og:description" content="Christian classics, carefully prepared.">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/styles.css">
    <script type="module" src="./assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="brand" href="./" aria-label="Kidderminster Press home">
        <img src="./assets/monogram.svg" alt="" width="32" height="32">
        <span>Kidderminster <span class="brand-second-line">Press</span></span>
      </a>
      <nav aria-label="Main navigation">
        <a class="nav-link" href="#books">Books</a>
      </nav>
    </header>

    <main id="main" class="wrap">
      <section class="introduction" aria-labelledby="site-title">
        <img class="crest" src="./assets/crest.svg?v=2" alt="" width="164" height="244" fetchpriority="high">
        <h1 id="site-title">Kidderminster Press</h1>
        <p class="tagline">Christian classics, carefully prepared.</p>
      </section>

      <section id="books" class="books" aria-labelledby="books-heading">
        <div class="section-heading">
          <h2 id="books-heading">Books</h2>
          <span class="section-rule" aria-hidden="true"></span>
        </div>
        <div id="catalogue" class="catalogue">
          <div class="empty-state">
            <p class="empty-title">Forthcoming editions</p>
            <p>Our first books are in preparation.</p>
          </div>
        </div>
        <noscript><p class="noscript-note">JavaScript is needed for purchasing books.</p></noscript>
      </section>
    </main>

    <footer class="site-footer wrap">
      <p>© <span id="year">2026</span> Kidderminster Press</p>
    </footer>
  </body>
</html>
